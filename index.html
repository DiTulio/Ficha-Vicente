        :root {
            color-scheme: dark;
            --bg: #0a0908;
            --pn: #12100e;
            --ln: #2a2320;
            --tx: #ece4dc;
            --dim: #8a7d72;
            --em: #ff6a1a;
            --gd: #ffb347

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font-family: 'Archivo', system-ui, sans-serif
        }

        body::before {
            content: "";
            position: fixed;
            inset: auto 0 0 0;
            height: 45vh;
            background: radial-gradient(ellipse at 50% 130%, rgba(255, 106, 26, .28), transparent 65%);
            pointer-events: none;
            animation: glow 5s ease-in-out infinite
        }

        @keyframes glow {
            50% {
                opacity: .6
            }
        }

        .mono {
            font-family: 'IBM Plex Mono', monospace;
            letter-spacing: .14em;
            text-transform: uppercase;
            font-size: .72rem
        }

        .big {
            font-weight: 900;
            letter-spacing: -.02em;
            line-height: .95
        }

        .tile {
            border: 1px solid var(--ln);
            background: var(--pn);
            padding: 14px 16px;
            text-align: left;
            transition: border-color .2s, background .2s
        }

        button.tile:hover,
        .hov:hover {
            border-color: var(--em);
            background: #1a120d
        }

        .bx {
            border: 1px solid var(--ln);
            background: transparent;
            color: var(--tx);
            padding: 6px 12px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: .78rem;
            cursor: pointer;
            transition: all .15s
        }

        .bx:hover {
            border-color: var(--em);
            color: var(--gd)
        }

        .bx.on {
            background: #2b1508;
            border-color: var(--em);
            color: var(--gd)
        }

        .in {
            background: transparent;
            border: 0;
            border-bottom: 1px solid var(--ln);
            color: var(--tx);
            outline: 0;
            width: 100%;
            padding: 4px 2px;
            font: inherit
        }

        .in:focus {
            border-color: var(--em)
        }

        textarea.in {
            border: 1px solid var(--ln);
            padding: 8px;
            min-height: 110px;
            resize: vertical
        }

        select.in {
            background: var(--pn)
        }

        .row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            padding: 5px 0;
            cursor: pointer
        }

        .row i {
            flex: 1;
            border-bottom: 1px dotted var(--ln);
            transform: translateY(-3px)
        }

        .row:hover b {
            color: var(--gd)
        }

        .nav a {
            display: flex;
            gap: 14px;
            padding: 14px 20px;
            cursor: pointer;
            color: var(--dim);
            border-left: 2px solid transparent;
            transition: all .15s
        }

        .nav a:hover {
            color: var(--tx)
        }

        .nav a.on {
            color: var(--gd);
            background: #15100c;
            border-left-color: var(--em)
        }

        .pop {
            animation: pop .35s cubic-bezier(.2, 1.4, .4, 1)
        }

        @keyframes pop {
            from {
                transform: translateY(10px) scale(.9);
                opacity: 0
            }
        }

        .fade {
            animation: fade .35s ease
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(6px)
            }
        }

        .flame {
            background: linear-gradient(180deg, #fff0c0, var(--gd) 40%, var(--em));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        :focus-visible {
            outline: 2px solid var(--gd);
            outline-offset: 2px
        }

        @media (prefers-reduced-motion:reduce) {

            *,
            body::before {
                animation: none !important;
                transition: none !important
            }
        }
    </style>
</head>

       <div>${sec('Herança do clã Gojo')}<div className="space-y-3 text-[#c9bdb2]"><p><b className="text-[var(--tx)]">Bônus de atributo.</b> +2 em INT ou SAB e +1 no outro (já aplicado).</p><p><b className="text-[var(--tx)]">Treinamentos de clã.</b> Treinado em 2 perícias entre Feitiçaria, Percepção e Intuição (ou especialista em uma).</p><p><b className="text-[var(--tx)]">Potencial Lendário.</b> +1 PE em todo nível par e +1 Feitiço no nível 1 e nos níveis 5, 10, 15 e 20.</p></div></div></div>
      ${sec('Domínio dos Fundamentos', s.fund.length + ' de ' + fundMax + ' escolhidas')}<div className="grid md:grid-cols-2 gap-x-10">${FUND.map(([n, d]) => { const on = s.fund.includes(n); return h`<div key=${n} className="border-t border-[var(--ln)] py-3 flex gap-3"><button className=${'bx h-fit ' + (on ? 'on' : '')} onClick=${() => set('fund', on ? s.fund.filter(x => x !== n) : [...s.fund, n])}>${on ? 'ativo' : 'off'}</button><div><b>${n}</b><p className="m-0 text-[#c9bdb2]">${d}</p></div></div>` })}</div>
      ${sec('Feitiços', `${s.fe.length} de ${nFe} · acesso até nível ${acesso}`)}<p className="text-[#c9bdb2]">Conjuração Aprimorada: Feitiço de dano soma <b>${sg(M[s.tec])}</b> (nível 1-2) ou <b>${sg(2 * M[s.tec])}</b> (nível 3).</p>
      <div className="grid md:grid-cols-2 gap-px bg-[var(--ln)]">${s.fe.map((f, i) => {
                const up = (k, v) => set('fe', s.fe.map((x, j) => j === i ? { ...x, [k]: v } : x)); const c = cost(f); return h`<div key=${i} className="tile"><div className="flex gap-3"><input className="in font-bold text-lg" value=${f.n} aria-label="Nome do Feitiço" onChange=${e => up('n', e.target.value)}/><button className="bx" aria-label="Remover" onClick=${() => set('fe', s.fe.filter((_, j) => j !== i))}>✕</button></div>
        <div className="grid grid-cols-3 gap-3 my-3"><label><span className="mono text-[var(--dim)]">Nível</span><select className="in" value=${f.nv} onChange=${e => { up('nv', +e.target.value); up('custo', undefined) }}>${[0, 1, 2, 3, 4, 5].filter(n => n <= acesso).map(n => h`<option key=${n} value=${n}>${n}</option>`)}</select></label>
         <label><span className="mono text-[var(--dim)]">Custo PE</span><input type="number" className="in" value=${c} onChange=${e => up('custo', +e.target.value)}/></label>
         <label><span className="mono text-[var(--dim)]">Dano</span><input className="in" placeholder="2d6" value=${f.dano} onChange=${e => up('dano', e.target.value)}/></label></div>
        <textarea className="in !min-h-[70px]" placeholder="Efeito, alcance, CD…" value=${f.desc} onChange=${e => up('desc', e.target.value)}></textarea>
        <div className="flex gap-2 mt-3"><button className="bx on" onClick=${() => cast(f)}>Conjurar ${sg(atkT)}</button><button className="bx" onClick=${() => dmgRoll(f)}>Rolar dano</button><span className="mono text-[var(--dim)] ml-auto self-center">CD ${cdA}</span></div></div>`
            })}</div>
      <button className="bx mt-4" onClick=${() => set('fe', [...s.fe, { n: 'Novo Feitiço', nv: 0, dano: '', desc: '' }])}>+ Feitiço</button>
      ${sec('Aptidões amaldiçoadas', '1 por nível')}${area('apt', 'Anote suas aptidões amaldiçoadas', 4)}</div>`;

            const pgLore = h`<div>${head(4, 'Lore', 'O que aconteceu, em ordem')}<h2 className="big text-4xl m-0 mb-6">${s.nome}</h2>${area('lore', 'Ainda não escrita.', 10)}</div>`;
            const pgDom = h`<div>${head(5, 'Domínio', 'Expansão de domínio')}</div>`;
            const pgProg = h`<div>${head(6, 'Progressão', 'Níveis 1 a 20')}${evo}<p className="text-[#c9bdb2] max-w-2xl">PV usa o valor fixo (5 + CON por nível). A linha do seu nível fica destacada. Atributos como estão hoje.</p>
      <div className="overflow-x-auto border border-[var(--ln)] mt-4"><table className="w-full text-left mono normal-case tracking-normal min-w-[720px]"><thead className="bg-black/50 text-[var(--dim)] uppercase"><tr>${['Nível', 'BT', 'PV', 'PE', 'Defesa', 'CD', 'Feitiços', 'Acesso', 'Marco'].map(c => h`<th key=${c} className="p-3 font-normal">${c}</th>`)}</tr></thead><tbody>
      ${Array.from({ length: 20 }, (_, i) => i + 1).map(n => { const b = 2 + [5, 9, 13, 17].filter(x => n >= x).length, hf = Math.floor(n / 2); const fe = 3 + (n - 1) + [5, 10, 15, 20].filter(x => n >= x).length + [10, 20].filter(x => n >= x).length; const ac = n < 4 ? 1 : n < 7 ? 2 : n < 11 ? 3 : n < 15 ? 4 : 5; return h`<tr key=${n} className=${'border-t border-[var(--ln)] ' + (n === L ? 'bg-[#2b1508] text-[var(--gd)]' : 'text-[#c9bdb2]')}><td className="p-3">${n}</td><td className="p-3">${sg(b)}</td><td className="p-3">${10 + M.con + (n - 1) * (5 + M.con)}</td><td className="p-3">${6 * n + M[s.tec] + hf}</td><td className="p-3">${10 + M.des + hf}</td><td className="p-3">${10 + hf + M[s.tec] + b}</td><td className="p-3">${fe}</td><td className="p-3">${ac}</td><td className="p-3 font-sans text-sm">${MARCO[n] || 'Habilidade de Especialista em Técnicas (ou talento) e aptidão amaldiçoada.'}</td></tr>` })}</tbody></table></div></div>`;
            const pgRes = h`<div>${head(7, 'Resumo', 'A ficha em 2 minutos')}
      <p className="text-2xl max-w-3xl font-bold leading-snug">${s.nome} é um Especialista em Técnica do clã Gojo, nível ${L}. Vive da técnica <span className="flame">${s.tecnica || 'Soberania das Chamas'}</span>: seus Feitiços dependem de ${AT.find(a => a[0] === s.tec)[2]}, e ele aprimora cada conjuração com os Fundamentos.</p>
      ${sec('A ficha em uma linha', 'Construção')}
      ${[['Origem', 'Herdado (Clã Gojo)'], ['Especialização', 'Especialista em Técnica (d8)'], ['Técnica', s.tecnica || 'Soberania das Chamas'], ['Atributo da técnica', AT.find(a => a[0] === s.tec)[2]], ['PV / PE', `${pvMax} / ${peMax}`], ['Defesa / Atenção', `${def} / ${aten}`], ['CD Amaldiçoada', cdA], ['Acerto da técnica', sg(atkT)], ['Fundamentos', s.fund.join(', ') || 'nenhum'], ['Feitiços', `${s.fe.length} de ${nFe}, até nível ${acesso}`]].map(([a, b]) => h`<div key=${a} className="row !cursor-default"><span>${a}</span><i></i><b className="mono normal-case tracking-normal">${b}</b></div>`)}
      <p className="text-[#c9bdb2] mt-4 max-w-2xl">Conjuração Aprimorada soma ${sg(M[s.tec])} ao dano dos Feitiços de nível 1 e 2. O clã Gojo dá +1 PE por nível par e Feitiços extras.</p></div>`;
            const pgMes = h`<div>${head(8, 'Mestre', 'Só o que importa na mesa')}<div className="grid grid-cols-2 md:grid-cols-4 gap-px bg-[var(--ln)]">${stat('PV', `${pv}/${pvMax}`, 'vida')}${stat('PE', `${pe}/${peMax}`, 'energia')}${stat('Defesa', def, '')}${stat('CD', cdA, 'Feitiços')}</div>
      ${sec('Resistências')}<div className="flex flex-wrap gap-2">${RS.map(([n, a]) => h`<span key=${n} className="bx">${n} ${sg(sk(n, a))}</span>`)}</div>${sec('Notas de campanha')}${area('notas', 'Anotações para a mesa', 8)}</div>`;

            const pages = [pgFicha, pgAcoes, pgTec, pgLore, pgDom, pgProg, pgRes, pgMes];
            const exp = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(s, null, 1)], { type: 'application/json' })); a.download = 'ficha-vicente.json'; a.click() };
            const imp = e => { const f = e.target.files[0]; f && f.text().then(t => { try { setS({ ...D, ...JSON.parse(t) }) } catch (x) { alert('Arquivo inválido') } }) };
            const bar = (l, v, mx, k, ds) => h`<div className="flex items-center gap-1 border-r border-[var(--ln)] pr-3 mr-1"><span className="mono text-[var(--dim)] mr-1">${l}</span>${ds.filter(d => d < 0).map(d => h`<button key=${d} className="bx" onClick=${() => bump(k, mx, d)}>${d}</button>`)}<span className="mx-2 min-w-[70px] text-center border-b-2 border-[var(--em)]"><b className="big text-2xl">${v}</b> <span className="mono text-[var(--dim)]">/ ${mx}</span></span>${ds.filter(d => d > 0).map(d => h`<button key=${d} className="bx" onClick=${() => bump(k, mx, d)}>+${d}</button>`)}</div>`;

            return h`<div className="relative z-10 lg:pl-60">
      <aside className="lg:fixed lg:inset-y-0 lg:left-0 lg:w-60 border-r border-[var(--ln)] bg-[var(--bg)] z-30 flex lg:block flex-wrap">
       <div className="px-5 py-6 flex items-center gap-3"><span className="text-2xl">🔥</span><b className="big text-lg">VICENTE</b></div>
       <nav className="nav flex lg:block overflow-x-auto w-full lg:w-auto">${nav.map((n, i) => h`<a key=${n} className=${'mono whitespace-nowrap ' + (pg === i ? 'on' : '')} onClick=${() => setPg(i)}><span>${i + 1}</span>${n}</a>`)}</nav>
       <div className="flex lg:flex-col gap-2 p-5 lg:absolute lg:bottom-0"><button className="bx" onClick=${exp}>Exportar</button><label className="bx cursor-pointer">Importar<input type="file" accept=".json" className="hidden" onChange=${imp}/></label><button className="bx" onClick=${login}>${pw ? 'Sair do modo editor' : 'Modo editor'}</button><button className="bx" onClick=${() => confirm('Voltar ao padrão? No modo editor isso também apaga a ficha na nuvem.') && setS(D)}>Redefinir</button></div></aside>
      <header className="sticky top-0 z-20 bg-black/85 backdrop-blur border-b border-[var(--ln)] px-4 py-3 flex flex-wrap items-center gap-y-2">
       ${bar('PV', pv, pvMax, 'pvL', [-5, -1, 1, 5])}${bar('PE', pe, peMax, 'peL', [-1, 1])}
       <button className=${'bx ' + (adv === 'v' ? 'on' : '')} onClick=${() => setAdv(adv === 'v' ? null : 'v')}>vant.</button><button className=${'bx ' + (adv === 'd' ? 'on' : '')} onClick=${() => setAdv(adv === 'd' ? null : 'd')}>desv.</button>
       <label className="bx ml-2 flex items-center gap-2">NV<select className="bg-transparent" value=${L} onChange=${e => changeLevel(+e.target.value)}>${Array.from({ length: 20 }, (_, i) => h`<option key=${i} value=${i + 1} className="bg-black">${i + 1}</option>`)}</select></label>
       <button className="bx ml-2" onClick=${() => { setS(p => ({ ...p, pvL: 0, peL: 0 })); push('Descanso longo', 0, 'PV e PE cheios') }}>descanso</button>${pend.length ? h`<button className="bx ml-3" style=${{ borderColor: 'var(--em)', color: 'var(--gd)' }} onClick=${() => setPg(5)}>▲ ${pend.length} pendência(s)</button>` : ''}<span className=${'mono ml-3 ' + (sync === 'salvo' ? 'text-[var(--gd)]' : sync === 'erro' || sync === 'senha' ? 'text-red-400' : 'text-[var(--dim)]')} aria-live="polite">${SYN[sync]}</span></header>
      <main className="max-w-6xl mx-auto px-5 pb-32">${pages[pg]}</main>
      ${log[0] && pg !== 1 ? h`<div key=${log[0].id} className="pop fixed right-4 bottom-4 z-40 tile w-64 border-[var(--em)]"><div className="mono text-[var(--dim)]">${log[0].label}</div><div className="flex items-baseline gap-3"><span className="big text-4xl flame">${log[0].total}</span><span className="mono text-[var(--dim)] normal-case tracking-normal">${log[0].det}</span></div></div>` : ''}</div>`;
        }
        ReactDOM.createRoot(document.getElementById('root')).render(h`<${App}/>`);
    </script>

</body>

</html>
